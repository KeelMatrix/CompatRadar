name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  validate:
    name: Validate / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.424

      - name: Set up pinned .NET 11 preview SDK/runtime
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Verify pinned preview runtime is installed
        shell: pwsh
        run: |
          $runtimes = @(dotnet --list-runtimes)
          if (-not ($runtimes -match '^Microsoft\.NETCore\.App 11\.0\.0-preview\.7\.26381\.103\s')) {
            throw 'The pinned .NET 11 preview runtime is not visible to the host.'
          }

      - name: Configure macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          temp_directory="$RUNNER_TEMP/compatradar"
          mkdir -p "$temp_directory"
          echo "TMPDIR=$temp_directory/" >> "$GITHUB_ENV"

      - name: Verify CI telemetry suppression
        shell: pwsh
        run: |
          if ($env:KEELMATRIX_NO_TELEMETRY -ne '1') { throw 'KEELMATRIX_NO_TELEMETRY must be 1 in CI.' }

      - name: Snapshot telemetry state
        shell: pwsh
        run: |
          function Get-TelemetryFiles {
            $bases = @(
              [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile),
              [IO.Path]::GetTempPath()
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

            foreach ($base in $bases) {
              $roots = @(
                (Join-Path $base 'KeelMatrix'),
                (Join-Path $base '.local/share/KeelMatrix'),
                (Join-Path $base '.config/KeelMatrix'),
                (Join-Path $base '.cache/KeelMatrix')
              ) | Select-Object -Unique
              foreach ($root in $roots) {
                if (Test-Path -LiteralPath $root) {
                  Get-ChildItem -LiteralPath $root -Recurse -Force -File -ErrorAction SilentlyContinue |
                    Select-Object -ExpandProperty FullName
                }
              }
            }
          }

          @(Get-TelemetryFiles | Sort-Object) | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "compatradar-telemetry-before-$env:GITHUB_RUN_ID.txt") -Encoding utf8

      - name: Restore
        run: dotnet restore KeelMatrix.CompatRadar.sln --configfile NuGet.config

      - name: Build Release with warnings as errors
        run: dotnet build KeelMatrix.CompatRadar.sln -c Release --no-restore -warnaserror

      - name: Verify formatting with restore
        run: dotnet format KeelMatrix.CompatRadar.sln --verify-no-changes

      - name: Run full test suite
        shell: pwsh
        run: |
          dotnet test KeelMatrix.CompatRadar.sln -c Release --no-build --no-restore --logger "trx;LogFileName=compatradar-${{ matrix.os }}.trx" --results-directory ./artifacts/test-results
          if ($LASTEXITCODE -ne 0) { throw "CompatRadar tests failed on ${{ matrix.os }}." }

      - name: Check dependency vulnerabilities (fail closed)
        shell: pwsh
        run: |
          & ./scripts/security-audit.ps1 2>&1 | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($LASTEXITCODE -ne 0) { throw "Dependency vulnerability audit did not pass on ${{ matrix.os }} (exit $LASTEXITCODE)." }

      - name: Assert temporary comparison state was cleaned
        shell: pwsh
        run: |
          function Get-TempLeftovers {
            $tempRoot = [IO.Path]::GetTempPath()
            foreach ($name in @('compat-radar', 'compat-radar-tests', 'compat-radar-sdk-test', 'compat-radar-crlf', 'compat-radar-links')) {
              $path = Join-Path $tempRoot $name
              if (Test-Path -LiteralPath $path) {
                Get-ChildItem -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName |
                  Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
              }
            }
          }
          $leftovers = @()
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $leftovers = @(Get-TempLeftovers)
            if ($leftovers.Count -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($leftovers.Count -gt 0) { throw "Temporary CompatRadar state was not cleaned: $($leftovers -join ', ')" }

      - name: Assert no telemetry artifacts were produced
        shell: pwsh
        run: |
          function Get-TelemetryFiles {
            $bases = @(
              [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile),
              [IO.Path]::GetTempPath()
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique
            foreach ($base in $bases) {
              $roots = @(
                (Join-Path $base 'KeelMatrix'),
                (Join-Path $base '.local/share/KeelMatrix'),
                (Join-Path $base '.config/KeelMatrix'),
                (Join-Path $base '.cache/KeelMatrix')
              ) | Select-Object -Unique
              foreach ($root in $roots) {
                if (Test-Path -LiteralPath $root) {
                  Get-ChildItem -LiteralPath $root -Recurse -Force -File -ErrorAction SilentlyContinue |
                    Select-Object -ExpandProperty FullName
                }
              }
            }
          }
          $beforePath = Join-Path $env:RUNNER_TEMP "compatradar-telemetry-before-$env:GITHUB_RUN_ID.txt"
          $before = @(Get-Content -LiteralPath $beforePath -ErrorAction SilentlyContinue)
          $after = @(Get-TelemetryFiles | Sort-Object)
          $newFiles = @($after | Where-Object { $before -notcontains $_ })
          if ($newFiles.Count -gt 0) { throw "Telemetry artifacts were produced in CI: $($newFiles -join ', ')" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error

  validation-corpus:
    name: Validation corpus
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out pinned real-repository corpus
        uses: actions/checkout@v7
        with:
          repository: KeelMatrix/Redaction
          ref: 47c74880ff7f50e554cb9f06d84507f4a78a7818
          path: gate-corpus/KeelMatrix.Redaction

      - name: Check out pinned real-repository corpus
        uses: actions/checkout@v7
        with:
          repository: KeelMatrix/Telemetry
          ref: 225eca7002386cba951654da3dc963c14b0ba18e
          path: gate-corpus/KeelMatrix.Telemetry

      - name: Check out pinned real-repository corpus
        uses: actions/checkout@v7
        with:
          repository: KeelMatrix/QueryWatch
          ref: 3d93c9cc3e86d77e14880058a9df846040af282f
          path: gate-corpus/KeelMatrix.QueryWatch

      - name: Check out pinned external repository corpus
        uses: actions/checkout@v7
        with:
          repository: richardszalay/mockhttp
          ref: 459a661fc483f7a56e758d804d08a8618aa43c85
          path: gate-corpus/RichardSzalay.MockHttp
          persist-credentials: false

      - name: Check out pinned external repository corpus
        uses: actions/checkout@v7
        with:
          repository: wiremock/WireMock.Net
          ref: 42353f035eed154c50e080f79a77e2a69bc3a6dc
          path: gate-corpus/WireMock.Net
          persist-credentials: false

      - name: Check out pinned external repository corpus
        uses: actions/checkout@v7
        with:
          repository: VerifyTests/Verify
          ref: 424b010734f34a7257613ecbdc489e387aae4900
          path: gate-corpus/Verify
          persist-credentials: false

      - name: Set up stable .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.424

      - name: Set up pinned .NET 11 preview SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Set up pinned .NET 11 release candidate SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Run validation corpus
        shell: pwsh
        run: |
          $paths = @(
            'gate-corpus/KeelMatrix.Redaction',
            'gate-corpus/KeelMatrix.Telemetry',
            'gate-corpus/KeelMatrix.QueryWatch',
            'gate-corpus/RichardSzalay.MockHttp',
            'gate-corpus/WireMock.Net',
            'gate-corpus/Verify'
          )
          $corpusParameters = @{
            OutputPath = 'artifacts/validation-corpus.md'
            CorpusManifestPath = 'scripts/validation-corpus.json'
            WitnessPackOutputPath = 'artifacts/validation-witness-pack'
            PreviewCandidate = @(
              '11.0.100-preview.7.26381.103',
              '11.0.100-rc.1.26425.128'
            )
            RealRepositoryPath = $paths
          }
          & ./scripts/validation-corpus.ps1 @corpusParameters
          if ($LASTEXITCODE -ne 0) { throw "Validation corpus run did not pass (exit $LASTEXITCODE)." }

      - name: Publish validation evidence in job summary
        shell: pwsh
        run: Get-Content -LiteralPath artifacts/validation-corpus.md -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-corpus
          if-no-files-found: warn
          path: |
            artifacts/validation-corpus.md
            artifacts/validation-corpus.json
            artifacts/validation-witness-pack

  package:
    name: Package / inspect
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.424

      - name: Verify CI telemetry suppression
        shell: pwsh
        run: |
          if ($env:KEELMATRIX_NO_TELEMETRY -ne '1') { throw 'KEELMATRIX_NO_TELEMETRY must be 1 in CI.' }

      - name: Restore
        run: dotnet restore KeelMatrix.CompatRadar.sln --configfile NuGet.config

      - name: Build Release with warnings as errors
        run: dotnet build KeelMatrix.CompatRadar.sln -c Release --no-restore -warnaserror

      - name: Pack the exact tool and symbols
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $PWD 'artifacts/packages'
          if (Test-Path -LiteralPath $packageDirectory) { Remove-Item -LiteralPath $packageDirectory -Recurse -Force }
          New-Item -ItemType Directory -Path $packageDirectory | Out-Null
          dotnet pack src/KeelMatrix.CompatRadar/KeelMatrix.CompatRadar.csproj -c Release --no-build --no-restore --include-symbols --p:SymbolPackageFormat=snupkg --p:RepositoryCommit='${{ github.event.pull_request.head.sha || github.sha }}' --output $packageDirectory
          if ($LASTEXITCODE -ne 0) { throw 'dotnet pack failed.' }

      - name: Validate package set and contents
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $PWD 'artifacts/packages'
          $expected = @('KeelMatrix.CompatRadar.0.1.0.nupkg', 'KeelMatrix.CompatRadar.0.1.0.snupkg') | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath $packageDirectory -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($expected -join "`n") -ne ($actual -join "`n")) { throw "Unexpected package set. Expected: $($expected -join ', '); actual: $($actual -join ', ')." }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $forbiddenPath = '(?i)(^|/)(AGENTS\.md|\.env(?:\.local)?|local-telemetry|tests?|testresults|artifacts|obj|bin|\.vs|\.vscode)(/|$)'
          $forbiddenText = '(?i)(?:password|api[_-]?key|secret)\s*='
          $textExtensions = @('.nuspec', '.md', '.txt', '.json', '.xml', '.props', '.targets', '.cs', '.csproj')
          foreach ($package in Get-ChildItem -LiteralPath $packageDirectory -File) {
            $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              foreach ($entry in $archive.Entries) {
                $entryName = $entry.FullName.Replace('\', '/')
                if ($entryName -match $forbiddenPath) { throw "Forbidden package path '$entryName' found in $($package.Name)." }
                if ($textExtensions -contains ([IO.Path]::GetExtension($entryName).ToLowerInvariant()) -and $entry.Length -gt 0) {
                  $reader = [IO.StreamReader]::new($entry.Open())
                  try { $content = $reader.ReadToEnd() } finally { $reader.Dispose() }
                  if ($content -match $forbiddenText) { throw "Internal-only text found in $($package.Name): $entryName." }
                }
              }
              if ($package.Name -like '*.nupkg') {
                foreach ($required in @('README.md', 'LICENSE', 'icon.png')) {
                  if ($null -eq $archive.GetEntry($required)) { throw "Required package entry '$required' is missing from $($package.Name)." }
                }
              }
            }
            finally { $archive.Dispose() }
          }

      - name: Complete package contract inspection
        shell: pwsh
        run: pwsh -NoProfile -File scripts/inspect-package.ps1 -PackageDirectory artifacts/packages -ExpectedVersion 0.1.0 -ExpectedCommit '${{ github.event.pull_request.head.sha || github.sha }}'

      - name: Upload packed tool for cross-platform consumer smoke
        uses: actions/upload-artifact@v7
        with:
          name: compatradar-package
          retention-days: 1
          if-no-files-found: error
          path: |
            artifacts/packages/KeelMatrix.CompatRadar.0.1.0.nupkg
            artifacts/packages/KeelMatrix.CompatRadar.0.1.0.snupkg

  package-consumer-smoke:
    name: Package consumer smoke / ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.424

      - name: Download packed tool
        uses: actions/download-artifact@v7
        with:
          name: compatradar-package
          path: ./artifacts/packages

      - name: Run isolated package-consumer smoke
        shell: pwsh
        run: pwsh -NoProfile -File smoke/package-consumer-smoke.ps1 -PackagePath ./artifacts/packages/KeelMatrix.CompatRadar.0.1.0.nupkg

      - name: Assert smoke temporary state was cleaned
        shell: pwsh
        run: |
          $leftovers = @()
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $leftovers = @(Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Directory -Filter 'compat-radar-consumer-*' -ErrorAction SilentlyContinue)
            if ($leftovers.Count -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($leftovers.Count -gt 0) { throw "Package smoke temporary state was not cleaned: $($leftovers.FullName -join ', ')" }

      - name: Assert no telemetry artifacts were produced
        shell: pwsh
        run: |
          $bases = @(
            [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData),
            [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData),
            [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile),
            [IO.Path]::GetTempPath()
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique
          $telemetryFiles = @()
          foreach ($base in $bases) {
            foreach ($relativeRoot in @('KeelMatrix', '.local/share/KeelMatrix', '.config/KeelMatrix', '.cache/KeelMatrix')) {
              $root = Join-Path $base $relativeRoot
              if (Test-Path -LiteralPath $root) {
                $telemetryFiles += @(Get-ChildItem -LiteralPath $root -Recurse -Force -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
              }
            }
          }
          if ($telemetryFiles.Count -gt 0) { throw "Telemetry artifacts were produced in package smoke: $($telemetryFiles -join ', ')" }

  action-smoke:
    name: GitHub Action smoke
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.424

      - name: Download freshly packed tool
        uses: actions/download-artifact@v7
        with:
          name: compatradar-package
          path: ./artifacts/packages

      - name: Install freshly packed tool in an isolated path
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/compatradar-tool" --add-source "$GITHUB_WORKSPACE/artifacts/packages" --configfile NuGet.config KeelMatrix.CompatRadar --version 0.1.0 --no-cache
          echo "$RUNNER_TEMP/compatradar-tool" >> "$GITHUB_PATH"

      - name: Create Action fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path action-fixture | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <UseAppHost>false</UseAppHost>
            </PropertyGroup>
          </Project>
          '@ | Set-Content action-fixture/Fixture.csproj
          @'
          Console.WriteLine("action fixture passed");
          '@ | Set-Content action-fixture/Program.cs
          @'
          <Project>
            <Target Name="VerifySupportedSdk" BeforeTargets="CoreCompile">
              <Error Condition="!$(NETCoreSdkVersion.StartsWith('8.0'))" Text="error: this repository requires the .NET 8 SDK; observed SDK $(NETCoreSdkVersion)." />
            </Target>
          </Project>
          '@ | Set-Content action-fixture/Directory.Build.props
          @'
          { "version": 1, "control": { "sdk": "current" }, "watch": [{ "kind": "sdk-preview", "candidates": ["8.0.424"] }], "validation": { "command": "dotnet run --project Fixture.csproj --no-restore --nologo", "workingDirectory": "action-fixture", "timeoutSeconds": 120 }, "policy": { "confirmationRuns": 1 } }
          '@ | Set-Content action-fixture/compat-radar.json
          $incompatibleSdk = (dotnet --list-sdks |
            ForEach-Object { ($_ -split ' ')[0] } |
            Where-Object { $_ -notmatch '^8\.' } |
            Sort-Object -Descending |
            Select-Object -First 1)
          if (-not $incompatibleSdk) { throw 'The Action smoke requires an installed SDK other than the pinned 8.x SDK.' }
          $candidateJson = '"' + $incompatibleSdk + '"'
          (Get-Content -LiteralPath action-fixture/compat-radar.json -Raw).Replace('"8.0.424"', $candidateJson) |
            Set-Content action-fixture/incompatible-sdk.json

      - name: Action pass path
        uses: ./
        env:
          COMPATRADAR_ACTION_SUMMARY: ${{ runner.temp }}/compatradar-action-summary.md
        with:
          config: action-fixture/compat-radar.json
          report: action-fixture/pass.json

      - name: Action regression path, summary, and report
        id: regression
        continue-on-error: true
        uses: ./
        env:
          COMPATRADAR_ACTION_SUMMARY: ${{ runner.temp }}/compatradar-action-summary.md
        with:
          config: action-fixture/incompatible-sdk.json
          report: action-fixture/failure.json

      - name: Create credential-feed fixture
        shell: pwsh
        run: |
          @'
          {
            "version": 1,
            "control": { "sdk": "current" },
            "watch": [{ "kind": "nuget-prerelease", "package": "Example.Dependency", "candidates": ["1.0.0"], "feed": "https://feed.example/v3/index.json?tenant=action-feed-credential-value#action-feed-credential-value" }],
            "validation": { "command": "dotnet run --project Fixture.csproj --no-restore --nologo", "workingDirectory": "action-fixture", "timeoutSeconds": 120 },
            "policy": { "confirmationRuns": 1 }
          }
          '@ | Set-Content action-fixture/credential-feed.json

      - name: Action credential-feed path
        id: credentialfeed
        continue-on-error: true
        uses: ./
        env:
          COMPATRADAR_ACTION_SUMMARY: ${{ runner.temp }}/compatradar-action-summary.md
        with:
          config: action-fixture/credential-feed.json
          report: action-fixture/credential-feed-report.json

      - name: Assert Action contract
        shell: pwsh
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          CREDENTIALFEED_OUTCOME: ${{ steps.credentialfeed.outcome }}
        run: |
          if ($env:REGRESSION_OUTCOME -ne 'failure') { throw "Action failure path did not propagate failure (outcome: $env:REGRESSION_OUTCOME)." }
          $pass = Get-Content action-fixture/pass.json -Raw | ConvertFrom-Json
          $failure = Get-Content action-fixture/failure.json -Raw | ConvertFrom-Json
          if ($pass.exitCode -ne 0) { throw 'Action pass report exit code mismatch.' }
          if ($failure.exitCode -ne 1 -or $failure.findings[0].classification -ne 'FUTURE_REGRESSION') { throw 'Action failure report mismatch.' }
          $summaryPath = Join-Path $env:RUNNER_TEMP 'compatradar-action-summary.md'
          $summary = Get-Content $summaryPath -Raw
          if (-not $summary.Contains('CompatRadar report')) { throw 'Action did not append a job summary.' }
          if ($env:CREDENTIALFEED_OUTCOME -ne 'failure') { throw "Action credential-feed path did not fail closed (outcome: $env:CREDENTIALFEED_OUTCOME)." }
          if ($summary.Contains('action-feed-credential-value')) { throw 'Action job summary leaked a feed credential.' }
          if (Test-Path action-fixture/credential-feed-report.json) { throw 'Action credential-feed path wrote a report for a rejected feed.' }
