name: Release

on:
  push:
    tags:
      - 'v0.1.0'

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  validate:
    name: Validate first release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive and validate one release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != 'v0.1.0' ]]; then
            echo 'First release workflow accepts only v0.1.0.' >&2
            exit 1
          fi
          echo 'release_version=0.1.0' >> "$GITHUB_OUTPUT"

      - name: Validate changelog and version contract
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: pwsh -NoProfile -File ./scripts/Test-ChangelogContract.ps1 -RepositoryPath $PWD -ChangelogPath CHANGELOG.md -ExpectedVersion $env:RELEASE_VERSION -ExpectedPackageVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.424

      - name: Verify telemetry suppression
        shell: pwsh
        run: if ($env:KEELMATRIX_NO_TELEMETRY -ne '1') { throw 'Telemetry must be disabled for release validation.' }

      - name: Restore with controlled sources and one version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: dotnet restore KeelMatrix.CompatRadar.sln --configfile NuGet.config --no-cache --force -p:CompatRadarReleaseVersion=$env:RELEASE_VERSION -p:RepositoryCommit=$env:GITHUB_SHA

      - name: Check dependency vulnerabilities (fail closed)
        shell: pwsh
        run: |
          & ./scripts/security-audit.ps1 2>&1 | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($LASTEXITCODE -ne 0) { throw "Dependency vulnerability audit did not pass (exit $LASTEXITCODE)." }

      - name: Build and test before pack
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          dotnet build KeelMatrix.CompatRadar.sln -c Release --no-restore -warnaserror -p:CompatRadarReleaseVersion=$env:RELEASE_VERSION -p:RepositoryCommit=$env:GITHUB_SHA
          dotnet test KeelMatrix.CompatRadar.sln -c Release --no-build --no-restore
          dotnet format KeelMatrix.CompatRadar.sln --verify-no-changes --no-restore

      - name: Pack exact release artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: dotnet pack src/KeelMatrix.CompatRadar/KeelMatrix.CompatRadar.csproj -c Release --no-build --no-restore --include-symbols --p:SymbolPackageFormat=snupkg --p:CompatRadarReleaseVersion=$env:RELEASE_VERSION --p:RepositoryCommit=$env:GITHUB_SHA --output artifacts/packages

      - name: Inspect exact package contract
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: pwsh -NoProfile -File scripts/inspect-package.ps1 -PackageDirectory artifacts/packages -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA

      - name: Validate packaged tool in an isolated consumer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: pwsh -NoProfile -File smoke/package-consumer-smoke.ps1 -PackagePath "artifacts/packages/KeelMatrix.CompatRadar.$env:RELEASE_VERSION.nupkg"

      - name: Upload exactly validated package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compatradar-first-release
          retention-days: 1
          if-no-files-found: error
          path: |
            artifacts/packages/KeelMatrix.CompatRadar.0.1.0.nupkg
            artifacts/packages/KeelMatrix.CompatRadar.0.1.0.snupkg

  publish:
    name: Publish validated first release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exactly validated package artifacts
        uses: actions/download-artifact@v8
        with:
          name: compatradar-first-release
          path: artifacts/packages

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Publish only validated artifacts
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $nupkg = Join-Path $PWD 'artifacts/packages/KeelMatrix.CompatRadar.0.1.0.nupkg'
          $snupkg = Join-Path $PWD 'artifacts/packages/KeelMatrix.CompatRadar.0.1.0.snupkg'
          if (-not (Test-Path -LiteralPath $nupkg) -or -not (Test-Path -LiteralPath $snupkg)) { throw 'Validated package artifacts are missing.' }
          dotnet nuget push $nupkg --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --no-symbols
          if ($LASTEXITCODE -ne 0) { throw 'Primary package publication failed; symbol publication was not attempted.' }
          dotnet nuget push $snupkg --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
          if ($LASTEXITCODE -ne 0) { throw 'Symbol package publication failed.' }
